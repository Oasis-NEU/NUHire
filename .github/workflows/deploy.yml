name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    # The Coolify secrets and the self-hosted runner only exist in the Khoury
    # repo. Anywhere else this job would sit queued for a runner that never
    # comes, then get cancelled.
    if: github.repository == 'Khoury-Co-op/NUHire'
    runs-on: khoury-coop-nuhire-runners
    steps:
      - name: Trigger coolify deploy
        run: |
          curl --request GET "${{ secrets.COOLIFY_WEBHOOK_PROD }}" --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
